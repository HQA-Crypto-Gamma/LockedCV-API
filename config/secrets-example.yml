---
# COPY this file to secrets.yml and modify as needed
development:
  DATABASE_URL: sqlite://db/local/development.db
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  MAILGUN_API_KEY: <set by Heroku Mailgun add-on or local test key>
  MAILGUN_DOMAIN: <set by Heroku Mailgun add-on>
  MAILGUN_FROM_EMAIL: <verified sender email, e.g., postmaster@your-mailgun-domain>
  MAILGUN_FROM_NAME: LockedCV
  SECURE_SCHEME: HTTP

test:
  DATABASE_URL: sqlite://db/local/test.db
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  MAILGUN_API_KEY: <set by Heroku Mailgun add-on or local test key>
  MAILGUN_DOMAIN: <set by Heroku Mailgun add-on>
  MAILGUN_FROM_EMAIL: <verified sender email, e.g., postmaster@your-mailgun-domain>
  MAILGUN_FROM_NAME: LockedCV
  SECURE_SCHEME: HTTP

production:
  DATABASE_URL: <do not set - assigned by production service>
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  SECURE_SCHEME: HTTPS
  MAILGUN_API_KEY: <set by Heroku Mailgun add-on>
  MAILGUN_DOMAIN: <set by Heroku Mailgun add-on>
  MAILGUN_FROM_EMAIL: <verified sender email, e.g., postmaster@your-mailgun-domain>
  MAILGUN_FROM_NAME: LockedCV
